name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no runtime deps by design)
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          pip install -e .
      - name: Prove the core has zero third-party runtime dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, json
          out = subprocess.run([sys.executable, "-m", "pip", "list", "--format=json"],
                               capture_output=True, text=True).stdout
          installed = {p["name"].lower() for p in json.loads(out)}
          banned = {"numpy", "pillow", "opencv-python", "opencv-python-headless",
                    "pikepdf", "pypdf", "pymupdf", "fitz", "pypdfium2",
                    "pytesseract", "paddleocr", "fastapi", "requests"}
          leaked = installed & banned
          assert not leaked, f"core install pulled optional deps: {sorted(leaked)}"
          print("core install is dependency-free")
          PY
      - name: Lint
        run: ruff check src tests
      - name: Unit tests
        run: python -m pytest tests/unit -q
      - name: Integration tests and quality gates
        run: python -m pytest tests/integration -q
      - name: Capability report
        run: python -m zfp.cli.main doctor

  optional-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with optional adapters
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e ".[vision,render,pdfbackends]"
      - name: Tests with adapters present
        run: python -m pytest tests -q
      - name: Capability report
        run: python -m zfp.cli.main doctor
